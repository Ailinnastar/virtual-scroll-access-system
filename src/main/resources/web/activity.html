<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VSAS — Activity log</title>
  <link rel="stylesheet" href="./css/library.css">
  <style>
    body { margin: 0; color: #293c29; }
    .activity-sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 190px; padding: 24px 12px;
      box-sizing: border-box; background: #142c24; border-right: 2px solid #647d50; z-index: 1; }
    .activity-sidebar h2 { color: #edcf8d; font: 26px "Cormorant Garamond", serif; margin: 0 16px 28px; }
    body[data-library-page='admin'] .activity-sidebar a { display: block; color: #f4e7ca; padding: 12px 16px; border-radius: 18px;
      text-decoration: none; font: 14px Inter, sans-serif; }
    .activity-sidebar a:hover, .activity-sidebar a[aria-current] { background: #425e3d; }
    main { max-width: 1040px; margin: 36px 36px 70px 226px; padding: 28px; background: #f4e7ca;
      border: 2px solid #bca38a; border-radius: 8px; box-shadow: 6px 6px 0 #0c201866; position: relative; z-index: 1; }
    h1 { font: 38px "Cormorant Garamond", serif; margin: 0 0 12px; }
    p { line-height: 1.5; }
    table { width: 100%; min-width: 660px; border-collapse: collapse; margin-top: 22px; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #bca38a; overflow-wrap: anywhere; }
    th { background: #e0d0bd; }
    #status { min-height: 1.5em; }
    @media (max-width: 750px) {
      .activity-sidebar { position: static; width: auto; display: flex; flex-wrap: wrap; align-items: center; }
      .activity-sidebar h2 { margin: 0 18px 0 0; }
      main { margin: 20px 12px 60px; padding: 18px; overflow-x: auto; }
    }
  </style>
</head>
<body data-library-page="admin">
  <nav class="activity-sidebar" aria-label="Administrator sidebar">
    <h2>VSAS</h2>
    <a href="dash.html">Dashboard</a>
    <a href="browse.html">Browse Scrolls</a>
    <a href="browse.html?favourites=1">Favourites</a>
    <a href="admin.html">Admin</a>
    <a href="activity.html" aria-current="page">Activity log</a>
  </nav>
  <main>
    <h1>System activity</h1>
    <p>Successful profile-name changes, scroll uploads and scroll deletions appear here. Times are shown in UTC.</p>
    <p id="status" role="status" aria-live="polite">Loading activity…</p>
    <div id="activity-content" hidden inert>
      <table>
        <thead><tr><th scope="col">Time</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Affected account or scroll</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </div>
  </main>
  <script>
    const labels = {PROFILE_NAME_CHANGED: 'Profile name changed', SCROLL_UPLOADED: 'Scroll uploaded',
      SCROLL_DELETED: 'Scroll deleted'};
    async function loadActivity() {
      const response = await fetch('/api/admin/activity', {cache: 'no-store'});
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Activity is unavailable');
      const rows = document.getElementById('events');
      rows.replaceChildren();
      for (const event of data.events) {
        const row = document.createElement('tr');
        const fields = [new Date(event.timestamp).toISOString(),
          `${event.actorUsername} (${event.actorId})`, labels[event.action] || event.action, event.targetId];
        for (const value of fields) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        }
        rows.append(row);
      }
      document.getElementById('activity-content').hidden = false;
      document.getElementById('activity-content').inert = false;
      const summary = data.events.length
        ? `${data.events.length} recorded event${data.events.length === 1 ? '' : 's'}`
        : 'No activity has been recorded yet.';
      document.getElementById('status').textContent = data.warning
        ? `${summary} Warning: ${data.warning}` : summary;
    }
    loadActivity().catch(error => {
      document.getElementById('status').textContent = error.message;
    });
  </script>
</body>
</html>
